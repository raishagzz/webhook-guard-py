[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-guard"
version = "0.1.0"
description = "Signature-verified webhook receiver with replay protection and idempotent delivery handling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Raisha Leal" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.1",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # anyio alias deprecation inside starlette's test client.
    "default::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 permits pytest's assert. S105/S106 flag string literals bound to
# secret-like names; test fixtures use deliberately fake secrets, and the rules
# stay active in src/, where a hardcoded credential would be a real finding.
"tests/*" = ["S101","S105", "S106"]
